name: KNPS Campsite & Eco Center Regular Report (06:00, 18:00 KST)

on:
  # 외부 웹 크론(cron-job.org) API 호출 및 수동 실행 트리거
  # (GitHub 내장 schedule의 수시간 지연 문제 방지를 위해 외부 크론으로 정시 호출)
  workflow_dispatch:

concurrency:
  group: knps-daily-report
  cancel-in-progress: true

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # STATUS.md 및 last_state.json 자동 커밋 및 푸시 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          pip install -r requirements.txt

      # 야영장 정기 리포트 실행 (장애 격리를 위해 개별 단계 및 continue-on-error 적용)
      - name: 🏕️ 국립공원 야영장 정기 종합 리포트(06시/18시) 실행
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -u campsite/main.py --daily

      # 생태탐방원 정기 리포트 실행 (야영장 실행 결과와 무관하게 반드시 독립 실행)
      - name: 🏡 국립공원 생태탐방원 정기 종합 리포트(06시/18시) 실행
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -u eco/main.py --daily

      # 변동 사항이 발생한 경우 STATUS.md 및 상태(last_state.json)를 GitHub 저장소에 자동 커밋 & 푸시
      - name: 실시간 현황(STATUS.md) 및 상태(last_state.json) Git 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset origin/main
            git add campsite/STATUS.md campsite/last_state.json eco/STATUS.md eco/last_state.json
            if ! git diff --staged --quiet; then
              echo "최신 현황(야영장 & 생태탐방원)을 GitHub 저장소에 커밋 및 푸시합니다. (시도 $i)"
              git commit -m "docs: 06시/18시 정기 종합 현황(야영장 & 생태탐방원) 및 기준선 업데이트 [자동]"
              if git push origin main; then
                echo "푸시 완료 ✅"
                break
              fi
              echo "동시 푸시 충돌 감지, 2초 후 재시도..."
              sleep 2
            else
              echo "변동 사항이 없어 Git 커밋을 생략합니다."
              break
            fi
          done
