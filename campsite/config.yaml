# 1. 감시할 야영장 및 시설 타입 목록
# 야영장별로 원하는 시설 타입(types)을 함께 지정할 수 있습니다.
# (비워두거나 types 항목을 생략하면 해당 야영장의 모든 시설을 감시합니다)
campsites:
  - park_name: "변산반도"
    camp_name: "고사포2"
    dept_id: "B181004"
    types: ["특화야영장"] # 예: 고사포2는 특화야영장(하우스 등)만 알림

  - park_name: "오대산"
    camp_name: "소금강산"
    dept_id: "B061001"
    types: ["카라반"]     # 예: 소금강산은 카라반만 알림

  - park_name: "설악산"
    camp_name: "설악동"
    dept_id: "B031005"
    types: ["카라반"]

  - park_name: "덕유산"
    camp_name: "덕유대3"
    dept_id: "B051006"
    types: ["특화야영장"]

# 2. 필터링 조건
filters:
  # 원하는 특정 날짜 목록 (비워두면 기간 또는 전체 날짜 대상)
  # 형식: YYYY-MM-DD
  target_dates: []
    # - "2026-10-03"
    # - "2026-10-04"

  # 조회 시작일 및 종료일 (target_dates 대신 범위로 지정할 경우)
  start_date: "2026-10-01"  # 예: "2026-10-01"
  end_date: "2026-10-31"    # 예: "2026-10-31"

  # 요일 필터 (비워두면 모든 요일, 지정하면 해당 요일만 알림)
  # 예: ["금", "토", "일"]
  target_weekdays: ["금", "토"]

  # [선택] 전역 기본 시설 타입
  # 위 campsites 목록에서 types 가 지정되지 않은 야영장에 기본 적용됩니다. (비워두면 전체)
  target_types: []

  # 특정 사이트 번호 지정 (비워두면 해당 영지 전체 사이트 번호 자동 조회)
  # 예: ["A13", "B1"]
  target_sites: []

  # 대기 예약 포함 여부 (false: 즉시 예약가능만, true: 대기예약도 포함)
  include_waiting: true

# 3. 알림 설정
notification:
  # 새로 열린 빈자리만 알림 (true: 이미 알림 보낸 자리는 도배 방지, false: 5분마다 매번 알림)
  only_new_slots: true

  # 예약 마감(취소표 사라짐) 알림 발송 여부 (true: 빈자리 마감/사라짐도 알림, false: 새로 생긴 빈자리만 알림)
  notify_closed_slots: true

  # 예약 상태 변경(예약가능 ➔ 대기예약) 알림 발송 여부
  notify_status_changes: true

  # 주말 2박(금,토) 연박 예약 가능 전용 긴급 알림 (true: 동일 영지에 금+토 연속 빈자리 발생 시 단독 알림 발송)
  notify_consecutive_weekend: true

  # 2박 연박 판정 시 대기예약 포함 여부
  # true: 대기 포함 연박도 알림 발송
  # false: 양일 모두 즉시 예약 가능(R)인 경우만 2박 연박 알림 발송 (권장)
  consecutive_include_waiting: false

  # [텔레그램 봇] (스마트폰 푸시 추천 1위)
  telegram:
    enabled: false
    bot_token: ""  # @BotFather 에게 발급받은 봇 토큰
    chat_id: ""    # @userinfobot 등에서 확인한 나의 채팅 ID

  # [디스코드 웹훅] (설정 간편 추천 2위)
  discord:
    enabled: true
    webhook_url: ""  # GitHub Actions Secrets (DISCORD_WEBHOOK_URL)에서 자동 주입됩니다.

  # [이메일 SMTP]
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: ""   # 발신자 구글 이메일
    smtp_pass: ""   # 구글 앱 비밀번호 (16자리)
    to_email: ""    # 수신자 이메일
    use_tls: true
