# 국립공원 생태탐방원 모니터링 설정 파일

# ==============================================================================
# 🏡 [전국 국립공원 전체 10개 생태탐방원 목록 참고]
# 아래 목록에서 원하는 생태탐방원을 복사하여 'eco_centers' 섹션에 등록하세요.
# 복사 예시:
#   - name: "북한산"
#     dept_id: "B971002"
#     capacities: [4, 6]  # 4인실, 6인실만 감시 (생략 시 전체 인실)
#
# ------------------------------------------------------------------------------
# 구분        | 생태탐방원      | dept_id (기관 코드) | 위치
# ------------------------------------------------------------------------------
# 수도권      | 북한산          | B971002             | 서울 도봉구
# 강원권      | 설악산          | B301002             | 강원 인제군
# 충청권      | 계룡산          | B163001             | 충남 공주시
# 충청/경북   | 소백산          | B123002             | 경북 영주시
# 전라권      | 내장산          | B331001             | 전북 정읍시
# 전라권      | 변산반도        | B183001             | 전북 부안군
# 전라/광주   | 무등산          | B231002             | 광주 북구
# 전남/지리   | 지리산          | B014003             | 전남 구례군
# 경북/가야   | 가야산          | B133002             | 경북 성주군
# 경남/해상   | 한려해상        | B024002             | 경남 통영시
# ==============================================================================

# 1. 감시할 생태탐방원 목록
eco_centers:
  - name: "북한산"
    dept_id: "B971002"
    # 원하는 인실/정원 필터 (생략하거나 []이면 전체 인실 감시)
    # 예: [4, 6]
    capacities: []

  - name: "설악산"
    dept_id: "B301002"
    capacities: []

  - name: "소백산"
    dept_id: "B123002"
    capacities: []

  - name: "변산반도"
    dept_id: "B183001"
    capacities: []

# 2. 필터링 조건
filters:
  # 원하는 특정 날짜 목록 (비워두면 기간 범위 적용)
  # 형식: YYYY-MM-DD
  target_dates: []
    # - "2026-10-02"
    # - "2026-10-03"

  # 조회 시작일 및 종료일 (target_dates 대신 범위로 지정할 경우)
  start_date: "2026-10-01"
  end_date: "2026-10-31"

  # 요일 필터 (비워두면 모든 요일, 지정하면 해당 요일만 알림)
  # 예: ["금", "토"]
  target_weekdays: ["금", "토"]

  # 반려동물 동반 가능 객실만 감시할지 여부 (true: 반려동물 객실만, false: 전체 객실)
  pet_only: false

# 3. 알림 설정
notification:
  # 새로 열린 빈자리만 알림 (true: 도배 방지, false: 5분마다 매번 알림)
  only_new_slots: true

  # 예약 마감(취소표 사라짐) 알림 발송 여부 (true: 마감 시에도 알림, false: 신규 빈자리만 알림)
  notify_closed_slots: true

  # 주말 2박(금,토) 연박 예약 가능 전용 긴급 알림
  notify_consecutive_weekend: true

  # [디스코드 웹훅]
  discord:
    enabled: true
    webhook_url: ""  # GitHub Actions Secrets (DISCORD_WEBHOOK_URL)에서 자동 주입됩니다.

  # [텔레그램 봇]
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

  # [이메일 SMTP]
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: ""
    smtp_pass: ""
    to_email: ""
    use_tls: true
