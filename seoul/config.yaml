    name: "User 1"
    enabled: true
    notification:
      only_new_slots: true
      notify_closed_slots: false
      notify_new_schedule_open: true  # 신규 월 오픈(안내중 -> 접수중) 및 신규 등록 알림
      discord:
        enabled: true
        webhook_url: ""
      telegram:
        enabled: false
        bot_token: ""
        chat_id: ""

