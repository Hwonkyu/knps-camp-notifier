# 서울시 공공서비스예약 (난지캠핑장 글램핑존 등) 자동 모니터링 설정 파일
# 날짜를 별도로 입력하지 않아도 당월 및 익월(다음 달) 일정을 100% 자동 추적합니다.

targets:
  - id: "nanji_glamping"
    name: "난지캠핑장 글램핑존"
    keyword: "글램핑"
    match_title: "글램핑"
    enabled: true

users:
